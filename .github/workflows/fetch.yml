name: fetch-and-deploy

on:
  schedule:
    - cron: "17 3 * * 1"   # weekly: Monday 03:17 UTC
  workflow_dispatch:       # "Run workflow" button for an on-demand refresh
  push:
    branches: [main]
    paths: ["site/**"]       # redeploy when the frontend changes

permissions:
  contents: write   # commit updated data/
  pages: write      # deploy to GitHub Pages
  id-token: write

concurrency:
  group: fetch-and-deploy
  cancel-in-progress: false

jobs:
  fetch:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Run pipeline
        # Claude auth via Workload Identity Federation: GitHub's OIDC token is exchanged
        # for a short-lived Anthropic token, so no API key is stored in the repo.
        # Don't add ANTHROPIC_API_KEY here: if set (even empty) it takes precedence over WIF.
        run: |
          fetch_jwt() {
            curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" \
              && mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          fetch_jwt
          # Log the token's claims (not the token) to compare against the federation rule.
          jq -cR 'split(".")[1] | gsub("-";"+") | gsub("_";"/") | @base64d | fromjson
            | {iss, sub, aud, ref, event_name, repository_owner, workflow}' "$ANTHROPIC_IDENTITY_TOKEN_FILE" || true
          # GitHub tokens expire after ~5 min; keep the file fresh for SDK token refreshes.
          ( while sleep 240; do fetch_jwt; done ) &
          python pipeline/main.py
        env:
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_01BLqTyEkrivthzTzcHQrX71
          ANTHROPIC_ORGANIZATION_ID: 7107212a-0d35-4002-bb40-61131ddaeca9
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01UxQZbHinvtHPPENBwHgv3M
          ANTHROPIC_WORKSPACE_ID: wrkspc_01VMcyqVkJDF8en7ocoPSr79
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/gha-jwt
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          MAX_LLM_PER_RUN: ${{ vars.MAX_LLM_PER_RUN }}
          MAX_ARTICLES_PER_RUN: ${{ vars.MAX_ARTICLES_PER_RUN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit data
        run: |
          git config user.name "feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: weekly feed $(date -u +%F)"
          git push

  deploy:
    needs: fetch
    if: always() && (needs.fetch.result == 'success' || needs.fetch.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pick up the data commit made by the fetch job
      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/* _site/
          mkdir _site/data
          cp data/latest.json data/projects.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
