name: fetch-and-deploy

on:
  schedule:
    - cron: "17 3 * * 1"   # weekly: Monday 03:17 UTC
  workflow_dispatch:       # "Run workflow" button for an on-demand refresh
  push:
    branches: [main]
    paths: ["site/**"]       # redeploy when the frontend changes

permissions:
  contents: write   # commit updated data/
  pages: write      # deploy to GitHub Pages
  id-token: write

concurrency:
  group: fetch-and-deploy
  cancel-in-progress: false

jobs:
  fetch:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Run pipeline
        run: python pipeline/main.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          MAX_LLM_PER_RUN: ${{ vars.MAX_LLM_PER_RUN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit data
        run: |
          git config user.name "feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: weekly feed $(date -u +%F)"
          git push

  deploy:
    needs: fetch
    if: always() && (needs.fetch.result == 'success' || needs.fetch.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pick up the data commit made by the fetch job
      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/* _site/
          mkdir _site/data
          cp data/latest.json data/projects.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
